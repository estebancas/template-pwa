version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let brand-new releases age a few days (yanks, hijacked publishes) before a PR opens.
    # Security updates are not delayed by this.
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    # Majors of the fragile toolchain are upgraded by hand: they are coupled to the pinned
    # Playwright image tag (ci.yml, package.json e2e:visual) and the Stryker patch-package
    # patch. Other majors still arrive as their own PR.
    ignore:
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@stryker-mutator/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite-plugin-pwa"
        update-types: ["version-update:semver-major"]
      # Peer of vite-plugin-pwa (declares ^1.0.0): a 2.x bump makes `npm install` fail with
      # ERESOLVE while `npm ci` still passes. Revisit when vite-plugin-pwa widens its range.
      - dependency-name: "@vite-pwa/assets-generator"
        update-types: ["version-update:semver-major"]
      # React and its types and test utilities are coupled through peer ranges (Testing Library
      # declares react and react-dom, the plugin declares vite). Upgrade them together by hand.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "wrangler"
        update-types: ["version-update:semver-major"]
      # typescript-eslint declares a peer range on TypeScript (>=4.8.4 <6.1.0 when this template
      # was made), so a new minor or major can make `npm install` fail with ERESOLVE while
      # `npm ci` still passes. Bump by hand once typescript-eslint widens its range.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
