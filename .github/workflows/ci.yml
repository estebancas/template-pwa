name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # CI logic lives in estebancas/standards (reusable workflows, pinned by commit SHA). The job
  # `name` values and the reusable job ids form the required status check contexts (for example
  # `Lint / lint`); see docs/contract.md in that repo before renaming either.
  lint:
    name: Lint
    uses: estebancas/standards/.github/workflows/lint.yml@f98d9c425e9202e976b3df49d02e03a59bdda773 # v1
    with:
      # generate-icons is otherwise unexercised by CI, so a bad dev-tool bump (e.g. an ESM-only
      # major) would pass every other check. Regenerate and compare to the committed icons and
      # iOS splash images.
      generated-assets-command: npm run generate-icons
      generated-assets-path: public/
      generated-assets-required-files: |
        public/pwa-64x64.png
        public/pwa-192x192.png
        public/pwa-512x512.png
        public/maskable-icon-512x512.png
        public/apple-touch-icon-180x180.png
        public/favicon.ico
        public/apple-splash-*.png

  test:
    name: Unit tests + build
    uses: estebancas/standards/.github/workflows/test-build.yml@f98d9c425e9202e976b3df49d02e03a59bdda773 # v1

  mutation:
    name: Mutation testing
    uses: estebancas/standards/.github/workflows/mutation.yml@f98d9c425e9202e976b3df49d02e03a59bdda773 # v1

  audit:
    name: Dependency audit
    uses: estebancas/standards/.github/workflows/audit.yml@f98d9c425e9202e976b3df49d02e03a59bdda773 # v1

  size:
    name: Bundle size
    needs: test
    uses: estebancas/standards/.github/workflows/size.yml@f98d9c425e9202e976b3df49d02e03a59bdda773 # v1

  e2e:
    name: End-to-end
    needs: test
    uses: estebancas/standards/.github/workflows/e2e.yml@f98d9c425e9202e976b3df49d02e03a59bdda773 # v1
    with:
      # Keep this tag equal to the installed @playwright/test version and to the image in the
      # `e2e:visual` script in package.json, so browsers and fonts match and visual baselines
      # render identically.
      container-image: mcr.microsoft.com/playwright:v1.64.0-noble

  # Not a required check. Skipped until the repo variable CLOUDFLARE_ACCOUNT_ID is set, so a new
  # project stays green (and raises no `production` approval) before Cloudflare is configured.
  # See TEMPLATE.md for the setup: Worker name in wrangler.jsonc, the URL below, the variable
  # and the CLOUDFLARE_API_TOKEN secret.
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    environment:
      name: production
      # Replace with your Worker's URL: https://<worker name>.<account subdomain>.workers.dev
      url: https://template-pwa.example.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          # The deploy job publishes, so it must not restore a cache an earlier run could have poisoned.
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: wrangler deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
